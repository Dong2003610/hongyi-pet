<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提醒</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #reminder-card { width: 100%; height: 100%; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--surface, #ffffff); border-radius: var(--radius, 24px); padding: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .title { font-size: 16px; font-weight: 600; color: var(--text, #3a2a20); margin-bottom: 10px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 12px; color: var(--muted, #9a7b6a); }
    input[type="text"], input[type="datetime-local"], select {
      width: 100%; padding: 8px 12px; border: 1px solid var(--accent, #ffc987); border-radius: 10px; font-size: 13px;
      color: var(--text, #3a2a20); background: var(--background, #fff7ed); outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary, #ff8a24); }
    .btn-row { display: flex; gap: 8px; }
    button { flex: 1; padding: 8px 14px; border: none; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary, #ff8a24); color: white; }
    .btn-secondary { background: var(--background, #fff7ed); color: var(--text, #3a2a20); }
    .btn-snooze { background: var(--accent, #ffc987); color: var(--text, #3a2a20); flex: 1; }
    .due-soon { display: none; }
    .due-soon.show { display: flex; flex-direction: column; gap: 8px; }
    .due-text { font-size: 15px; font-weight: 500; color: var(--text, #3a2a20); }
    .snooze-row { display: flex; gap: 6px; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="reminder-card">
    <div class="card" id="compose-card">
      <div class="title">⏰ 添加提醒</div>
      <div class="input-group">
        <label>提醒内容</label>
        <input type="text" id="reminder-text" placeholder="输入提醒内容…">
      </div>
      <div class="input-group">
        <label>提醒时间</label>
        <input type="datetime-local" id="reminder-time">
      </div>
      <div class="input-group">
        <label>重复</label>
        <select id="reminder-repeat">
          <option value="none">单次</option>
          <option value="daily">每天</option>
          <option value="weekdays">工作日</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" id="cancel-btn">取消</button>
        <button class="btn-primary" id="save-btn">保存</button>
      </div>
    </div>
    <div class="card due-soon" id="due-soon-card">
      <div class="title">🔔 提醒</div>
      <div class="due-text" id="due-text"></div>
      <div class="btn-row">
        <button class="btn-primary" id="know-btn">知道了</button>
      </div>
      <div class="snooze-row">
        <button class="btn-snooze" data-minutes="5">5分钟后再说</button>
        <button class="btn-snooze" data-minutes="10">10分钟</button>
        <button class="btn-snooze" data-minutes="15">15分钟</button>
      </div>
    </div>
  </div>
</body>
</html>
