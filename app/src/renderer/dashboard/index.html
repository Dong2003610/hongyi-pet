<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌宠小屋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #dashboard { width: 100%; height: 100%; padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
    .card { background: var(--surface, #ffffff); border-radius: var(--radius, 24px); padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    #drag-area { position: absolute; top: 0; left: 0; right: 48px; height: 60px; cursor: move; pointer-events: none; }
    .pet-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--background, #fff7ed); overflow: hidden; flex-shrink: 0; }
    .pet-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .pet-info h2 { font-size: 18px; font-weight: 600; color: var(--text, #3a2a20); margin-bottom: 2px; cursor: pointer; }
    .pet-info p { font-size: 12px; color: var(--muted, #9a7b6a); }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-item { background: var(--background, #fff7ed); border-radius: 12px; padding: 10px; }
    .stat-label { font-size: 11px; color: var(--muted, #9a7b6a); margin-bottom: 4px; }
    .stat-value { font-size: 18px; font-weight: 600; color: var(--text, #3a2a20); }
    .stat-value small { font-size: 11px; font-weight: normal; color: var(--muted, #9a7b6a); }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text, #3a2a20); margin-bottom: 8px; }
    .interactions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .interaction-btn { padding: 8px 12px; border: none; border-radius: 10px; background: var(--background, #fff7ed); color: var(--text, #3a2a20); font-size: 13px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; }
    .interaction-btn:hover { background: var(--accent, #ffc987); transform: translateY(-1px); }
    .chat-area { margin-bottom: 12px; }
    .chat-messages { max-height: 120px; overflow-y: auto; margin-bottom: 8px; padding: 4px 0; font-size: 12px; color: var(--text, #3a2a20); }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--accent, #ffc987); border-radius: 2px; }
    .chat-msg { padding: 4px 0; border-bottom: 1px solid var(--background, #fff7ed); }
    .chat-msg .role { font-weight: 600; color: var(--primary, #E53935); }
    .chat-input-row { display: flex; gap: 6px; }
    .chat-input { flex: 1; padding: 8px 10px; border: 1px solid var(--accent, #ffc987); border-radius: 8px; font-size: 13px; outline: none; background: var(--background, #fff7ed); color: var(--text, #3a2a20); }
    .chat-input:focus { border-color: var(--primary, #ff8a24); }
    .chat-send { padding: 8px 14px; border: none; border-radius: 8px; background: var(--primary, #E53935); color: white; font-size: 13px; cursor: pointer; }
    .chat-send:hover { opacity: 0.9; }
    .reminder-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .reminder-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--accent, #ffc987); border-radius: 8px; font-size: 13px; outline: none; background: var(--background, #fff7ed); color: var(--text, #3a2a20); }
    .reminder-row input:focus { border-color: var(--primary, #ff8a24); }
    .reminder-row button { padding: 8px 12px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .reminder-add { background: var(--primary, #E53935); color: white; }
    .reminder-add:hover { opacity: 0.9; }
    .reminder-list { max-height: 140px; overflow-y: auto; }
    .reminder-list::-webkit-scrollbar { width: 4px; }
    .reminder-list::-webkit-scrollbar-thumb { background: var(--accent, #ffc987); border-radius: 2px; }
    .reminder-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--background, #fff7ed); font-size: 12px; }
    .reminder-item .info { flex: 1; min-width: 0; }
    .reminder-item .time { font-weight: 500; color: var(--text, #3a2a20); }
    .reminder-item .text { color: var(--muted, #9a7b6a); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reminder-item .repeat-tag { font-size: 10px; background: var(--accent, #ffc987); color: var(--text, #3a2a20); border-radius: 4px; padding: 1px 4px; margin-left: 4px; }
    .reminder-item button { padding: 3px 8px; border: none; border-radius: 6px; background: #ff6b6b; color: white; font-size: 11px; cursor: pointer; flex-shrink: 0; margin-left: 6px; }
    .settings-group { margin-bottom: 8px; }
    .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--background, #fff7ed); }
    .setting-item:last-child { border-bottom: none; }
    .setting-label { font-size: 13px; color: var(--text, #3a2a20); }
    .setting-desc { font-size: 11px; color: var(--muted, #9a7b6a); }
    .toggle { position: relative; width: 40px; height: 22px; background: var(--muted, #9a7b6a); border-radius: 11px; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
    .toggle.active { background: var(--primary, #ff8a24); }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: white; border-radius: 50%; transition: transform 0.2s; }
    .toggle.active::after { transform: translateX(18px); }
    .size-selector { display: flex; gap: 6px; }
    .size-btn { padding: 4px 10px; border: 1px solid var(--accent, #ffc987); border-radius: 6px; background: transparent; color: var(--text, #3a2a20); font-size: 11px; cursor: pointer; transition: all 0.2s; }
    .size-btn.active { background: var(--primary, #ff8a24); border-color: var(--primary, #ff8a24); color: white; }
    .pomodoro-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 12px; background: var(--background, #fff7ed); border-radius: 10px; font-size: 12px; }
    .pomodoro-bar .timer { font-weight: 600; color: var(--text, #3a2a20); font-variant-numeric: tabular-nums; }
    .pomodoro-btn { padding: 6px 12px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .pomodoro-start { background: var(--primary, #E53935); color: white; }
    .pomodoro-stop { background: #ff6b6b; color: white; }
    .action-btn { padding: 8px 14px; border: none; border-radius: 10px; background: var(--background, #fff7ed); color: var(--text, #3a2a20); font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .action-btn:hover { background: var(--accent, #ffc987); }
    .close-btn { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border: none; background: var(--background, #fff7ed); border-radius: 50%; color: var(--muted, #9a7b6a); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .close-btn:hover { background: var(--accent, #ffc987); color: var(--text, #3a2a20); }
    .content-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 6px; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--accent, #ffc987) var(--background, #fff7ed); }
    .content-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .content-scroll::-webkit-scrollbar-track { background: var(--background, #fff7ed); border-radius: 3px; }
    .content-scroll::-webkit-scrollbar-thumb { background: var(--accent, #ffc987); border-radius: 3px; }
    .content-scroll::-webkit-scrollbar-thumb:hover { background: var(--primary, #ff8a24); }
  </style>
</head>
<body>
  <div id="dashboard">
    <div class="card" style="position: relative; flex: 1; display: flex; flex-direction: column;">
      <div id="drag-area"></div>
      <button class="close-btn" id="close-btn">×</button>
      <div class="content-scroll">
        <div class="header">
          <div class="pet-avatar"><img id="pet-avatar-img" alt="avatar"></div>
          <div class="pet-info">
            <h2 id="pet-name" title="点击编辑名字">桌宠</h2>
            <input id="pet-name-input" type="text" maxlength="50" style="display: none; font-size: 18px; font-weight: 600; border: 1px solid var(--accent, #ffc987); border-radius: 8px; padding: 2px 6px; outline: none; background: var(--background, #fff7ed); color: var(--text, #3a2a20);" />
            <p id="pet-personality">正在加载角色信息</p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">💕 好感度</div>
            <div class="stat-value" id="affection">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">😊 心情</div>
            <div class="stat-value" id="mood">80</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">🎯 今日互动</div>
            <div class="stat-value" id="today-interactions">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">⏰ 陪伴时长</div>
            <div class="stat-value" id="companion-minutes">0<small>分钟</small></div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">💬 聊天</div>
          <div class="chat-area">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
              <input class="chat-input" id="chat-input" placeholder="说点什么…" maxlength="500">
              <button class="chat-send" id="chat-send">发送</button>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">✨ 互动</div>
          <div class="interactions" id="interactions-list"></div>
        </div>

        <div class="settings-group">
          <div class="section-title">🍅 番茄钟</div>
          <div class="pomodoro-bar" id="pomodoro-bar">
            <span id="pomodoro-status">未开始</span>
            <span class="timer" id="pomodoro-timer"></span>
            <button class="pomodoro-btn pomodoro-start" id="pomodoro-start-btn">开始专注</button>
            <button class="pomodoro-btn pomodoro-stop" id="pomodoro-stop-btn" style="display:none;">停止</button>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">⏰ 提醒</div>
          <div class="reminder-row">
            <input id="reminder-text" placeholder="提醒内容…">
            <input id="reminder-time" type="datetime-local">
            <select id="reminder-repeat" style="padding:6px 8px; border:1px solid var(--accent, #ffc987); border-radius:8px; font-size:12px; background:var(--background, #fff7ed); color:var(--text, #3a2a20);">
              <option value="none">单次</option>
              <option value="daily">每天</option>
              <option value="weekdays">工作日</option>
            </select>
            <button class="reminder-add" id="reminder-add-btn">添加</button>
          </div>
          <div class="reminder-list" id="reminders-list"></div>
        </div>

        <div class="settings-group">
          <div class="section-title">⚙️ 设置</div>
          <div class="setting-item">
            <div><div class="setting-label">置顶显示</div><div class="setting-desc">桌宠窗口始终在最前面</div></div>
            <div class="toggle active" id="toggle-always-on-top"></div>
          </div>
          <div class="setting-item">
            <div><div class="setting-label">鼠标穿透</div><div class="setting-desc">点击穿透到后面的窗口（Alt+Z 临时取消）</div></div>
            <div class="toggle" id="toggle-click-through"></div>
          </div>
          <div class="setting-item">
            <div><div class="setting-label">开机自启</div><div class="setting-desc">开机时自动运行</div></div>
            <div class="toggle" id="toggle-open-at-login"></div>
          </div>
          <div class="setting-item">
            <div><div class="setting-label">音效</div><div class="setting-desc">互动和提醒音效</div></div>
            <div class="toggle active" id="toggle-sound"></div>
          </div>
          <div class="setting-item">
            <div><div class="setting-label">久坐提醒</div><div class="setting-desc">超过 45 分钟提醒起身</div></div>
            <div class="toggle active" id="toggle-sedentary"></div>
          </div>
          <div class="setting-item">
            <div><div class="setting-label">桌宠大小</div><div class="setting-desc">调整桌宠显示大小</div></div>
            <div class="size-selector" id="size-selector">
              <button class="size-btn" data-scale="0.5">最小</button>
              <button class="size-btn" data-scale="0.6">小</button>
              <button class="size-btn active" data-scale="0.8">标准</button>
              <button class="size-btn" data-scale="1">大</button>
              <button class="size-btn" data-scale="1.2">超大</button>
              <button class="size-btn" data-scale="1.5">巨大</button>
            </div>
          </div>
          <div class="setting-item">
            <div><div class="setting-label">文件口袋</div><div class="setting-desc">拖文件到桌宠身上收藏</div></div>
            <button class="action-btn" id="open-pocket-btn">打开口袋</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
