name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - name: Disable git line ending conversion
        run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run all unit tests
        run: npx tsx --test tests/unit/*.test.ts tests/unit/*.test.mjs

      - name: Verify Windows rollback helper
        run: npm run test:updates

      - name: Build portable package
        run: npm run portable:win

      - name: Prepare versioned update package
        run: node tools/prepare-update-release.mjs

      - name: Publish formal update release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/package version mismatch' }
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already exists; retaining its original immutable update assets.'
          } else {
            gh release create $env:GITHUB_REF_NAME "release/hongyi-pet-win32-x64-v$version.zip" release/update-manifest.json --verify-tag --title "小红桌宠 $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongyi-pet-portable-win
          path: app/release/*
          if-no-files-found: error
