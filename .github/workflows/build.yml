name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: hongyi-pet-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - name: Disable git line ending conversion
        run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prepare automatic main release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/auto-release.mjs prepare

      - name: Type check
        run: npx tsc --noEmit

      - name: Run all unit tests
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem -LiteralPath tests/unit -File | Where-Object { $_.Name -match '\.test\.(ts|mjs)$' } | Select-Object -ExpandProperty FullName)
          if ($testFiles.Count -eq 0) { throw 'No unit tests found' }
          npx tsx --test @testFiles

      - name: Verify Windows rollback helper
        run: npm run test:updates

      - name: Verify Chromium update transport
        run: node tests/e2e/update-network.e2e.cjs

      - name: Build portable package
        run: npm run portable:win

      - name: Prepare versioned update package
        run: node tools/prepare-update-release.mjs

      - name: Commit verified release version and tag
        id: auto-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/auto-release.mjs finalize

      - name: Publish formal update release
        if: startsWith(github.ref, 'refs/tags/v') || steps.auto-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag/package version mismatch' }
          $draft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -eq 'true') {
              gh release upload $tag "release/hongyi-pet-win32-x64-v$version.zip" release/update-manifest.json --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed' }
              gh release edit $tag --draft=false --latest --notes-file RELEASE_NOTES.md
              if ($LASTEXITCODE -ne 0) { throw 'Draft publication failed' }
            } else {
              Write-Output 'Release already exists; retaining its original immutable update assets.'
            }
          } else {
            gh release create $tag "release/hongyi-pet-win32-x64-v$version.zip" release/update-manifest.json --verify-tag --draft --title "小红桌宠 $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release draft upload failed' }
            gh release edit $tag --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongyi-pet-portable-win
          path: app/release/*
          if-no-files-found: error
